<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
      color: #333;
    }
    .container {
      padding: 20px;
      text-align: center;
    }
    .header {
      margin-bottom: 15px;
    }
    .logo {
      display: block;
      width: 48px;
      height: 48px;
      margin: 0 auto 5px;
    }
    h2 {
      margin: 5px 0;
      font-size: 18px;
      color: #2c2c2c;
    }
    .popup-description {
      margin-bottom: 20px;
      text-align: left;
    }
    .desc-subtitle {
      margin: 0 0 8px;
      color: #333;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
    }
    .desc-list {
      margin: 0;
      padding-left: 20px;
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }
    .desc-list li + li {
      margin-top: 2px;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      background-color: #e6f4ea;
      color: #1e8e3e;
      border-radius: 15px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 15px;
    }
    .popup-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px 0;
      background-color: #24292e;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    .popup-btn:hover {
      background-color: #444;
    }
    .options-btn {
      margin-bottom: 10px;
      background-color: #0069ff;
    }
    .popup-btn svg {
      margin-right: 8px;
      fill: white;
    }
    .footer {
      margin-top: 15px;
      font-size: 11px;
      color: #999;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img
        class="logo"
        src="icons/bbicon_48x48.png"
        alt="BB Better Layout logo"
      >
      <h2>BB Better Layout</h2>
    </div>

    <div class="status-badge">● Active</div>

    <!-- Keep the subtitle separate from the semantic feature list for accessibility. -->
    <div class="popup-description">
      <p class="desc-subtitle">A cleaner Blackboard Ultra experience</p>
      <ul class="desc-list">
        <li>Side navigation</li>
        <li>Clear course banners</li>
        <li>Back-to-top controls</li>
        <li>Themes and shortcuts</li>
        <li>Custom external link</li>
        <li>Study notes and Weekly schedule</li>
      </ul>
    </div>

    <a id="shortcuts-btn" href="#" class="popup-btn options-btn">
      Customize Appearance &amp; Shortcuts
    </a>

    <a href="https://bb.dukehsu.com" target="_blank" rel="noopener noreferrer" class="popup-btn">
      <svg height="20" width="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2Zm-1 17.93C7.05 19.44 4 16.08 4 12c0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93Zm6.9-2.54C17.64 16.58 16.9 16 16 16h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39Z"></path>
      </svg>
      Visit Website
    </a>

    <div class="footer">
      Version <span id="extension-version"></span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
